# SPDX-License-Identifier: GPL-2.0-or-later
# Build and test Panero on the target distribution base (Ubuntu 24.04 "noble",
# which Zorin OS 18.1 is built on). Runs on pushes and pull requests with a
# read-only token; no secrets are used.
name: CI

on:
  push:
    branches: [main, 'feature/**', 'experiment/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build dependencies (Ubuntu 24.04 archive only)
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            $(grep -v '^#' dev/build-deps.txt | xargs)

      - name: Record build environment
        run: |
          cat /etc/os-release | head -4
          gcc --version | head -1; cmake --version | head -1
          dpkg-query -W qtbase5-dev libkf5kio-dev extra-cmake-modules

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_INSTALL_PREFIX=/usr -DBUILD_TESTING=ON

      - name: Build
        run: ninja -C build

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: cd build && xvfb-run -a ctest --output-on-failure

      - name: Stage install
        run: DESTDIR="$PWD/stage" ninja -C build install && find stage -type f | sort | head -50

  # Experimental native Windows x64 build (MSYS2 UCRT64, Qt 5.15, KF5 5.116).
  # See dev/windows/README.md. It produces a portable ZIP with the executable,
  # the DLLs and the runtime plugins.
  windows-build:
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up MSYS2 UCRT64
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          update: true
          cache: true
          install: >-
            curl zip
          pacboy: >-
            gcc:p cmake:p ninja:p pkgconf:p extra-cmake-modules:p
            qt5-base:p qt5-svg:p qt5-tools:p qt5-winextras:p qt5-imageformats:p
            gettext-tools:p zlib:p bzip2:p xz:p dbus:p

      - name: Install pinned KDE Frameworks 5
        run: dev/windows/install-kf5.sh

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON -DCMAKE_INSTALL_PREFIX="$PWD/stage"

      - name: Build
        run: ninja -C build -k 0

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: cd build && ctest --output-on-failure

      - name: Package portable ZIP
        run: dev/windows/package.sh build stage dist

      - name: Upload ZIP
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: panero-windows-x64
          path: dist/panero-*-windows-x64.zip
          if-no-files-found: error
          retention-days: 30

  # Launch the ZIP on a fresh runner without MSYS2 on PATH, check that every
  # loaded DLL comes from the ZIP or from Windows, and run the GUI checks.
  windows-launch:
    needs: windows-build
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout (test scripts only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: dev/windows

      - name: Download ZIP
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: panero-windows-x64
          path: zip

      - name: Launch check and GUI test
        run: dev/windows/launch-test.ps1 -ZipDir zip -OutDir results

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: panero-windows-test-results
          path: results
          retention-days: 30
