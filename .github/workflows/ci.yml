# SPDX-License-Identifier: GPL-2.0-or-later
# Build and test Panero on the target distribution base (Ubuntu 24.04 "noble",
# which Zorin OS 18.1 is built on). Runs on pushes and pull requests with a
# read-only token; no secrets are used.
name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build dependencies (Ubuntu 24.04 archive only)
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            $(grep -v '^#' dev/build-deps.txt | xargs)
          # cloud security tests: FUSE mounts, a private D-Bus session and keyring
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            fuse3 dbus dbus-daemon gnome-keyring unzip curl

      - name: Fetch Panero's rclone (pinned, checksum verified)
        run: dev/scripts/fetch-rclone.sh "$RUNNER_TEMP/rclone" amd64

      - name: Record build environment
        run: |
          cat /etc/os-release | head -4
          gcc --version | head -1; cmake --version | head -1
          dpkg-query -W qtbase5-dev libkf5kio-dev extra-cmake-modules

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_INSTALL_PREFIX=/usr -DBUILD_TESTING=ON
          -DPANERO_RCLONE_BINARY="$RUNNER_TEMP/rclone/rclone"

      - name: Build
        run: ninja -C build

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: cd build && xvfb-run -a ctest --output-on-failure

      - name: Cloud security tests (private keyring, no accounts)
        run: dev/scripts/cloud-security-test.sh build -v1

      - name: Stage install
        run: DESTDIR="$PWD/stage" ninja -C build install && find stage -type f | sort | head -50
