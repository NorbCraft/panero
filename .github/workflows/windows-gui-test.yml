# Re-run only the Windows launch/GUI test against the ZIP of an earlier CI run
# (no rebuild). Started by hand: Actions > Windows GUI test > Run workflow.
name: Windows GUI test

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'CI run id whose panero-windows-x64 artifact to test'
        required: true

permissions:
  contents: read
  actions: read

jobs:
  windows-launch:
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout (test scripts only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: dev/windows

      - name: Download ZIP from run ${{ inputs.run_id }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: panero-windows-x64
          path: zip
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}

      - name: Set up Python (GUI automation)
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Launch check and GUI test
        run: dev/windows/launch-test.ps1 -ZipDir zip -OutDir results

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: panero-windows-test-results
          path: results
          retention-days: 30
