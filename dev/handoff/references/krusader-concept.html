<div id="krusader-workflow" aria-label="Krusader · Commander workflow concept">
  <header class="kw-titlebar">
    <span class="kw-brand"><i data-lucide="panels-top-left" aria-hidden="true"></i>Krusader</span>
    <span class="kw-title-context">Downloads &nbsp; / &nbsp; Workshop</span>
    <div class="kw-menus" aria-label="Application menus"><button type="button" data-action="menu">File</button><button type="button" data-action="menu">Edit</button><button type="button" data-action="view">View</button><button type="button" data-action="menu">Tools</button></div>
    <span class="kw-window-buttons" aria-hidden="true"><i data-lucide="minus"></i><i data-lucide="square"></i><i data-lucide="x"></i></span>
  </header>
  <nav class="kw-toolbar" aria-label="Main toolbar">
    <div class="kw-toolgroup"><button type="button" data-action="up"><i data-lucide="arrow-up" aria-hidden="true"></i>Up</button><button type="button" data-action="home"><i data-lucide="house" aria-hidden="true"></i>Home</button><button type="button" data-action="refresh"><i data-lucide="refresh-cw" aria-hidden="true"></i>Refresh</button></div>
    <div class="kw-toolgroup"><button type="button" data-action="compare" data-tooltip="Compare file contents with KDiff3"><i data-lucide="columns-2" aria-hidden="true"></i>Compare</button><button type="button" data-action="pack"><i data-lucide="archive" aria-hidden="true"></i>Pack</button><button type="button" data-action="unpack"><i data-lucide="package-open" aria-hidden="true"></i>Unpack</button></div>
    <div class="kw-toolgroup"><button type="button" data-action="search"><i data-lucide="search" aria-hidden="true"></i>Search</button></div>
    <button type="button" class="kw-trash-button" data-action="trash" data-tooltip="Open Trash in the active panel"><i data-lucide="trash-2" aria-hidden="true"></i>Trash</button>
  </nav>
  <div class="kw-viewbar">
    <button type="button" data-action="tree" aria-pressed="true"><i data-lucide="panel-left" aria-hidden="true"></i>Folder tree</button>
    <span class="kw-view-separator"></span>
    <button type="button" data-action="hidden" aria-pressed="false"><i data-lucide="eye-off" aria-hidden="true"></i>Hidden files</button>
    <div class="kw-view-switch" aria-label="Active panel view"><button type="button" data-mode="details" aria-pressed="true" data-tooltip="Details view"><i data-lucide="list" aria-hidden="true"></i><span>Details</span></button><button type="button" data-mode="thumbnails" aria-pressed="false" data-tooltip="Thumbnail view"><i data-lucide="layout-grid" aria-hidden="true"></i><span>Thumbnails</span></button></div>
    <button type="button" class="kw-settings-button" data-action="view" aria-expanded="false"><i data-lucide="sliders-horizontal" aria-hidden="true"></i>View &amp; colors</button>
  </div>
  <div class="kw-workspace">
    <aside class="kw-navigation" aria-label="Navigation for the active panel">
      <div class="kw-nav-top"><span>Navigation</span><span class="kw-follows">Left panel</span><button type="button" data-action="tree" aria-label="Hide folder tree"><i data-lucide="panel-left-close" aria-hidden="true"></i></button></div>
      <div class="kw-nav-heading"><span><i data-lucide="pin" aria-hidden="true"></i>Pinned</span><button type="button" data-action="pin" aria-label="Pin current folder" data-tooltip="Pin the active panel’s folder"><i data-lucide="plus" aria-hidden="true"></i></button></div>
      <div class="kw-pins"></div>
      <div class="kw-nav-heading kw-tree-heading"><span><i data-lucide="folder-tree" aria-hidden="true"></i>Folders</span></div>
      <div class="kw-tree"></div>
      <div class="kw-nav-storage"><i data-lucide="hard-drive" aria-hidden="true"></i><div><span class="kw-nav-drive">System</span><small class="kw-nav-free">204.7 GB free of 473 GB</small></div></div>
    </aside>
    <div class="kw-panels">
      <section class="kw-panel kw-active" data-panel="0" aria-label="Left file panel"></section>
      <section class="kw-panel" data-panel="1" aria-label="Right file panel"></section>
    </div>
  </div>
  <div class="kw-statusbar"><div class="kw-status-message" aria-live="polite">2 files marked · selection stays until you clear it</div><span class="kw-selection-legend"><span class="kw-cursor-dot"></span>Cursor <span class="kw-mark-dot"></span>Marked</span><button type="button" data-action="clear">Clear marks</button></div>
  <div class="kw-commandline" hidden><i data-lucide="terminal" aria-hidden="true"></i><label for="kw-command">~/Downloads $</label><input id="kw-command" aria-label="Command line preview" placeholder="Command line" autocomplete="off"></div>
  <nav class="kw-keybar" aria-label="File operations"><button type="button" data-action="rename"><kbd>F2</kbd>Rename</button><button type="button" data-action="viewfile"><kbd>F3</kbd>View</button><button type="button" data-action="edit"><kbd>F4</kbd>Edit</button><button type="button" data-action="copy" class="kw-copy"><kbd>F5</kbd><span>Copy →</span></button><button type="button" data-action="move"><kbd>F6</kbd>Move</button><button type="button" data-action="folder"><kbd>F7</kbd>New folder</button><button type="button" data-action="delete"><kbd>F8</kbd>Delete</button><button type="button" data-action="terminal"><kbd>F9</kbd>Terminal</button></nav>
  <section class="kw-settings" role="dialog" aria-label="View and colors" hidden>
    <div class="kw-popover-title"><span>View &amp; colors</span><button type="button" data-action="close-settings" aria-label="Close view settings"><i data-lucide="x" aria-hidden="true"></i></button></div>
    <div class="kw-setting-row"><label for="kw-row-height">Row height</label><input id="kw-row-height" type="range" min="29" max="44" value="35"><output for="kw-row-height">35 px</output></div>
    <div class="kw-color-controls"><label for="kw-mark-color">Marked files<input id="kw-mark-color" type="color" value="#b3393f"></label><label for="kw-cursor-color">Cursor / active panel<input id="kw-cursor-color" type="color" value="#326fd1"></label></div>
    <label class="kw-check"><input type="checkbox" id="kw-show-hidden">Show hidden files and folders</label>
    <label class="kw-check"><input type="checkbox" id="kw-show-command">Show command line</label>
    <label class="kw-check"><input type="checkbox" id="kw-show-modified" checked>Show Modified column</label>
    <div class="kw-setting-section">Selection</div>
    <div class="kw-setting-note">Right-click or Space to mark<br>Click or ↑ ↓ to move the cursor<br>Hold right-click for the context menu</div>
    <div class="kw-setting-row"><label for="kw-hold-delay">Right-click hold</label><select id="kw-hold-delay"><option value="450">Short · 0.45 s</option><option value="600" selected>Normal · 0.6 s</option><option value="850">Long · 0.85 s</option></select></div>
  </section>
  <div class="kw-context" role="menu" aria-label="File context menu" hidden></div>
  <div class="kw-overlay" hidden><section class="kw-dialog" role="dialog" aria-modal="true" aria-labelledby="kw-dialog-title"></section></div>
</div>
<style>
#krusader-workflow { color-scheme:light dark; --kw-bg:light-dark(#fff,#1d222b); --kw-chrome:light-dark(#f4f6f9,#252b35); --kw-soft:light-dark(#f8f9fb,#212630); --kw-text:light-dark(#273243,#e4eaf3); --kw-muted:light-dark(#69778a,#9eacbf); --kw-border:light-dark(#e1e7ef,#374151); --kw-hover:light-dark(#edf1f6,#2b3340); --kw-cursor:#326fd1; --kw-mark:#b3393f; --kw-cursor-text:light-dark(var(--kw-cursor),color-mix(in srgb,var(--kw-cursor) 60%,#fff)); --kw-mark-text:light-dark(var(--kw-mark),color-mix(in srgb,var(--kw-mark) 55%,#fff)); --kw-folder:light-dark(#b68430,#d5b171); --kw-row:35px; --kw-sidebar:180px; font:400 13px/1.45 Inter,"Segoe UI",sans-serif; border:1px solid var(--kw-border); border-radius:12px; background:var(--kw-bg); color:var(--kw-text); min-height:875px; display:flex; flex-direction:column; position:relative; overflow:hidden; }
#krusader-workflow * { box-sizing:border-box; }

#krusader-workflow button:hover { background:var(--kw-hover); }
#krusader-workflow button:focus-visible, #krusader-workflow input:focus-visible, #krusader-workflow select:focus-visible, #krusader-workflow summary:focus-visible { outline:2px solid var(--kw-cursor); outline-offset:-2px; }
#krusader-workflow svg { width:16px; height:16px; flex:none; stroke-width:1.65; }
#krusader-workflow .kw-titlebar { display:flex; align-items:center; gap:15px; padding:10px 16px; min-height:45px; background:var(--kw-chrome); }
#krusader-workflow .kw-brand { display:flex; align-items:center; gap:8px; font-weight:500; }

#krusader-workflow .kw-tab[aria-selected="true"] { color:var(--kw-text); border-bottom-color:var(--kw-cursor); background:var(--kw-bg); font-weight:500; }
#krusader-workflow .kw-tab-plus { margin-left:auto; padding:4px; color:var(--kw-muted); }
#krusader-workflow .kw-tab-plus svg { width:13px; height:13px; }

#krusader-workflow .kw-drivebar select { min-width:0; max-width:100%; flex:1; background:var(--kw-bg); border:1px solid var(--kw-border); border-radius:5px; padding:4px 5px; font-size:12px; }

#krusader-workflow .kw-commandline label { font:11px ui-monospace,monospace; }
#krusader-workflow .kw-commandline input { flex:1; min-width:0; border:0; background:transparent; padding:4px; font:12px ui-monospace,monospace; }
#krusader-workflow .kw-keybar { display:grid; grid-template-columns:repeat(8,minmax(0,1fr)); gap:4px; padding:8px; border-top:1px solid var(--kw-border); }
#krusader-workflow .kw-keybar button { border:1px solid var(--kw-border); padding:7px 3px; gap:5px; font-size:12px; white-space:nowrap; }
#krusader-workflow kbd { font:inherit; font-size:10px; border-radius:3px; padding:1px 3px; color:var(--kw-muted); background:var(--kw-soft); }
#krusader-workflow .kw-keybar .kw-copy { background:var(--kw-cursor); border-color:var(--kw-cursor); color:#fff; }
#krusader-workflow .kw-copy kbd { color:#fff; background:color-mix(in srgb,#fff 18%,var(--kw-cursor)); }
#krusader-workflow .kw-settings { position:absolute; z-index:6; right:10px; top:137px; width:310px; max-width:calc(100% - 20px); padding:15px; border:1px solid var(--kw-border); border-radius:10px; background:var(--kw-bg); box-shadow:0 12px 40px #0002; }
#krusader-workflow .kw-popover-title { display:flex; align-items:center; gap:10px; font-weight:500; margin-bottom:15px; }
#krusader-workflow .kw-popover-title button { margin-left:auto; padding:2px; color:var(--kw-muted); }
#krusader-workflow .kw-setting-row { display:flex; gap:8px; align-items:center; margin:14px 0; font-size:12px; }
#krusader-workflow .kw-setting-row input[type="range"] { min-width:50px; flex:1; width:80px; accent-color:var(--kw-cursor); }
#krusader-workflow .kw-setting-row output { color:var(--kw-muted); font-size:11px; white-space:nowrap; }
#krusader-workflow .kw-setting-row select { margin-left:auto; min-width:0; padding:5px; border:1px solid var(--kw-border); border-radius:5px; background:var(--kw-bg); font-size:11px; }
#krusader-workflow .kw-color-controls { display:grid; grid-template-columns:1fr 1fr; gap:15px; margin:18px 0; }
#krusader-workflow .kw-color-controls label { display:flex; flex-direction:column; gap:8px; font-size:11px; }
#krusader-workflow .kw-color-controls input { width:100%; height:29px; background:var(--kw-bg); border:1px solid var(--kw-border); border-radius:5px; padding:3px; }
#krusader-workflow .kw-check { display:flex; align-items:center; gap:8px; margin:12px 0; font-size:12px; }
#krusader-workflow .kw-check input { accent-color:var(--kw-cursor); }
#krusader-workflow .kw-setting-section { border-top:1px solid var(--kw-border); padding-top:15px; margin-top:17px; font-weight:500; font-size:12px; }
#krusader-workflow .kw-setting-note { color:var(--kw-muted); font-size:11px; line-height:1.8; margin-top:8px; }
#krusader-workflow .kw-context { position:absolute; z-index:8; min-width:205px; max-width:calc(100% - 20px); padding:5px; border:1px solid var(--kw-border); border-radius:9px; background:var(--kw-bg); box-shadow:0 10px 35px #0003; }
#krusader-workflow .kw-context-title { padding:7px 8px; font-size:11px; color:var(--kw-muted); border-bottom:1px solid var(--kw-border); margin-bottom:4px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#krusader-workflow .kw-context button { display:flex; justify-content:flex-start; width:100%; padding:7px 9px; font-size:12px; }
#krusader-workflow .kw-context .kw-shortcut { margin-left:auto; color:var(--kw-muted); font-size:11px; }
#krusader-workflow .kw-overlay { position:absolute; inset:0; z-index:9; background:light-dark(#25344a40,#0009); padding:22px; display:flex; justify-content:center; align-items:center; }
#krusader-workflow .kw-dialog { width:480px; max-width:100%; padding:23px; border:1px solid var(--kw-border); border-radius:12px; background:var(--kw-bg); box-shadow:0 16px 60px #0003; }
#krusader-workflow .kw-dialog.kw-wide-dialog { width:800px; }
#krusader-workflow .kw-dialog-heading { display:flex; gap:10px; align-items:center; margin-bottom:18px; }
#krusader-workflow .kw-dialog-heading > svg { color:var(--kw-cursor-text); width:21px; height:21px; }
#krusader-workflow .kw-dialog-heading h3 { margin:0; font-size:17px; font-weight:500; }
#krusader-workflow .kw-dialog-heading button { margin-left:auto; padding:3px; }
#krusader-workflow .kw-dialog label { display:block; color:var(--kw-muted); font-size:11px; margin:12px 0 5px; }
#krusader-workflow .kw-dialog input, #krusader-workflow .kw-dialog select { width:100%; min-width:0; border:1px solid var(--kw-border); border-radius:6px; padding:8px 10px; background:var(--kw-bg); }
#krusader-workflow .kw-dialog-summary { color:var(--kw-muted); font-size:12px; overflow-wrap:anywhere; margin-bottom:16px; }
#krusader-workflow .kw-dialog-route { padding:12px; display:grid; gap:13px; border-radius:7px; background:var(--kw-soft); font-size:12px; overflow-wrap:anywhere; }
#krusader-workflow .kw-dialog-route label { margin:0 0 2px; text-transform:uppercase; letter-spacing:.5px; font-size:10px; }
#krusader-workflow .kw-dialog-buttons { display:flex; justify-content:flex-end; gap:8px; margin-top:22px; }
#krusader-workflow .kw-dialog-buttons button { border:1px solid var(--kw-border); padding:8px 13px; }
#krusader-workflow .kw-dialog-buttons .kw-primary { color:#fff; background:var(--kw-cursor); border-color:var(--kw-cursor); }
#krusader-workflow .kw-preview { display:flex; justify-content:center; padding:15px; border-radius:8px; background:var(--kw-soft); }
#krusader-workflow .kw-preview img { width:100%; max-width:300px; border-radius:5px; }
#krusader-workflow .kw-preview pre { margin:0; width:100%; font:11px/1.9 ui-monospace,monospace; white-space:pre-wrap; overflow-wrap:anywhere; }
#krusader-workflow .kw-compare-files { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
#krusader-workflow .kw-diff { display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--kw-border); margin-top:18px; border:1px solid var(--kw-border); border-radius:6px; overflow:hidden; }
#krusader-workflow .kw-diff > div { padding:12px 0; min-width:0; background:var(--kw-bg); }
#krusader-workflow .kw-diff-code { display:block; padding:3px 12px; font:11px/1.6 ui-monospace,monospace; overflow-wrap:anywhere; }
#krusader-workflow .kw-diff-code.kw-removed { background:color-mix(in srgb,var(--kw-mark) 13%,var(--kw-bg)); }
#krusader-workflow .kw-diff-code.kw-added { background:light-dark(#e6f3ec,#283d35); }
#krusader-workflow .kw-menu-list button { display:flex; justify-content:flex-start; width:100%; }
#krusader-workflow .kw-empty-label { padding:25px 14px; font-size:12px; color:var(--kw-muted); }
#krusader-workflow.kw-no-modified .kw-modified { display:none; }
@media(max-width:950px) {
 #krusader-workflow { --kw-sidebar:166px; }
 #krusader-workflow .kw-title-context { display:none; }
 #krusader-workflow .kw-modified { display:none; }
 #krusader-workflow .kw-free-space { display:none; }
 #krusader-workflow .kw-keybar button { flex-direction:column; gap:3px; font-size:11px; }
 #krusader-workflow .kw-nav-top { flex-wrap:wrap; }
 #krusader-workflow .kw-nav-top .kw-follows { margin-left:0; }
 #krusader-workflow .kw-nav-top button { margin-left:auto; }
}
@media(max-width:670px) {
 #krusader-workflow .kw-workspace { flex-direction:column; }
 #krusader-workflow .kw-navigation { width:100%; border-right:0; border-bottom:1px solid var(--kw-border); display:grid; grid-template-columns:1fr 1fr; gap:0 12px; padding:10px; }
 #krusader-workflow .kw-nav-top { grid-column:1/-1; padding-bottom:9px; }
 #krusader-workflow .kw-nav-heading { grid-column:1; }
 #krusader-workflow .kw-pins { grid-column:1; }
 #krusader-workflow .kw-tree-heading { grid-column:2; grid-row:2; margin-top:0; }
 #krusader-workflow .kw-tree { grid-column:2; grid-row:3/5; }
 #krusader-workflow .kw-nav-storage { grid-column:1; align-self:end; margin-top:12px; }
 #krusader-workflow .kw-panels { grid-template-columns:minmax(0,1fr); }
 #krusader-workflow .kw-panel + .kw-panel { border-left:0; border-top:2px solid var(--kw-border); }
 #krusader-workflow .kw-panel + .kw-panel.kw-active { border-top-color:var(--kw-cursor); }
 #krusader-workflow .kw-modified { display:table-cell; }
 #krusader-workflow .kw-keybar { grid-template-columns:repeat(4,minmax(0,1fr)); }
 #krusader-workflow .kw-keybar button { flex-direction:row; }
 #krusader-workflow .kw-toolbar { gap:4px; padding:8px; }
 #krusader-workflow .kw-toolbar button { padding:6px; font-size:12px; }
 #krusader-workflow .kw-toolgroup { gap:0; }
 #krusader-workflow .kw-toolgroup + .kw-toolgroup { border-left:0; padding-left:0; }
 #krusader-workflow .kw-menus { display:none; }
 #krusader-workflow .kw-window-buttons { margin-left:auto; }
 #krusader-workflow .kw-viewbar { gap:5px; padding:7px 8px; }
 #krusader-workflow .kw-view-switch { margin-left:0; }
 #krusader-workflow .kw-settings-button { margin-left:auto; }
 #krusader-workflow .kw-view-separator { display:none; }
 #krusader-workflow .kw-statusbar { flex-wrap:wrap; gap:5px 10px; }
 #krusader-workflow .kw-selection-legend { margin-left:0; }
 #krusader-workflow .kw-statusbar button { margin-left:auto; }
 #krusader-workflow .kw-compare-files { grid-template-columns:1fr; }
 #krusader-workflow .kw-diff { grid-template-columns:1fr; }
 #krusader-workflow .kw-settings { top:175px; }
 #krusader-workflow .kw-overlay { align-items:flex-start; padding-top:160px; }
}
@media(max-width:380px) {
 #krusader-workflow .kw-modified { display:none; }
 #krusader-workflow .kw-nav-storage small { font-size:10px; }
 #krusader-workflow .kw-thumbnails { grid-template-columns:repeat(2,minmax(0,1fr)); }
 #krusader-workflow .kw-panel-label { font-size:9px; }
 #krusader-workflow .kw-ext { width:39px; }
 #krusader-workflow .kw-size { width:60px; }
 #krusader-workflow .kw-commandline label { display:none; }
}
@media(pointer:coarse) {
 #krusader-workflow button { min-height:44px; }
 #krusader-workflow .kw-file-button { min-height:44px; }
 #krusader-workflow .kw-table td { height:48px; }
 #krusader-workflow input, #krusader-workflow select { font-size:16px; }
}

 window.addEventListener('pointermove',e=>{if(press&&Math.hypot(e.clientX-press.x,e.clientY-press.y)>10){clearTimeout(press.timer);press=null;}});
 window.addEventListener('pointercancel',()=>{if(press)clearTimeout(press.timer);press=null;});
 root.addEventListener('contextmenu',e=>{if(e.target.closest('[data-file-area]'))e.preventDefault();});
 root.addEventListener('change',e=>{const t=e.target;if(t.hasAttribute('data-drive')){navigate(drives[t.value].start,+t.dataset.drive,t.value);return;}if(t.id==='kw-show-hidden')state.hidden=t.checked;else if(t.id==='kw-show-command')state.command=t.checked;else if(t.id==='kw-show-modified')state.modified=t.checked;else if(t.id==='kw-hold-delay')state.holdDelay=+t.value;else return;paint();save();});
 root.addEventListener('input',e=>{const t=e.target;if(t.id==='kw-row-height')state.rowHeight=+t.value;else if(t.id==='kw-mark-color')state.markColor=t.value;else if(t.id==='kw-cursor-color')state.cursorColor=t.value;else return;paint();save();});
 root.addEventListener('keydown',e=>{if(e.key==='Escape'){hideContext();closeSettings();if(!root.querySelector('.kw-overlay').hidden)closeDialog();return;}
  if(!root.querySelector('.kw-overlay').hidden){if(e.key==='Tab'){const controls=[...root.querySelector('.kw-dialog').querySelectorAll('button,input,select')],first=controls[0],last=controls.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}return;}
  if(e.target.matches('input,select')){if(e.key==='Enter'&&e.target.id==='kw-command'){e.preventDefault();setStatus('Command preview: '+e.target.value);}return;}
  if(e.ctrlKey&&e.key.toLowerCase()==='h'){e.preventDefault();act('hidden');return;}
  if(e.ctrlKey&&e.key.toLowerCase()==='a'){e.preventDefault();const p=state.panes[state.active];p.marks=list(p).map(f=>f.id);paint();focusCursor();save();return;}
  const p=state.panes[state.active],files=list(p),index=Math.max(0,files.findIndex(f=>f.id===p.cursor));
  if(['ArrowDown','ArrowUp','Home','End'].includes(e.key)&&e.target.closest('[data-file]')){e.preventDefault();const next=e.key==='Home'?0:e.key==='End'?files.length-1:Math.max(0,Math.min(files.length-1,index+(e.key==='ArrowDown'?1:-1)));if(files[next])moveCursor(state.active,files[next].id);return;}
  if((e.code==='Space'||e.key==='Insert')&&e.target.closest('[data-file]')){e.preventDefault();if(current(p))toggleMark(state.active,current(p).id);return;}
  if((e.shiftKey&&e.key==='F10'||e.key==='ContextMenu')&&e.target.closest('[data-file]')){e.preventDefault();const r=e.target.getBoundingClientRect();showContext(state.active,p.cursor,r.x+30,r.y+r.height);return;}
  if(e.key==='Tab'&&!e.shiftKey&&e.target.closest('[data-file]')){e.preventDefault();state.active=1-state.active;paint();focusCursor();save();return;}
  const keyMap={F2:'rename',F3:'viewfile',F4:'edit',F5:'copy',F6:'move',F7:'folder',F8:'delete',F9:'terminal',Delete:'delete'};
  if(keyMap[e.key]){e.preventDefault();act(keyMap[e.key]);return;}
  if(e.key==='Enter'&&e.target.closest('[data-file]')){e.preventDefault();act('open',[current(p)]);}
 });
 window.addEventListener('openai:set_globals',e=>{const saved=e.detail?.globals?.widgetState?.privateContent;if(saved){restore(saved);paint();}});
 paint();
 if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{paint();save();}});tweak.addSlider(state,'rowHeight',{label:'Row height',min:29,max:44,unit:'px'});tweak.addColorPicker(state,'cursorColor',{label:'Cursor color',reference:'--kw-cursor'});tweak.addColorPicker(state,'markColor',{label:'Marked file color',reference:'--kw-mark'});tweak.addToggle(state,'tree',{label:'Folder tree'});}
})();
</script>
